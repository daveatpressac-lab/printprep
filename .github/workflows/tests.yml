name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Demo runs
        run: python examples/halo_demo.py

  package:
    name: distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
      - name: Validate metadata
        run: python -m twine check --strict dist/*
      - name: The wheel installs and its command line runs
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          /tmp/wheel-env/bin/printprep --version
      - name: The sdist carries a test suite that actually runs
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && /tmp/wheel-env/bin/python -m unittest discover -s tests
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
