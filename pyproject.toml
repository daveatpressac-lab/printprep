[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "printprep"
version = "0.1.0"
description = "Prepare finished artwork for garment printing: key backgrounds without halos, fit to the print canvas without distortion, and measure the result."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daveatpressac-lab" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "opencv-python-headless>=4.6",
  "Pillow>=9.1",
]
keywords = [
  "print-on-demand", "dtg", "garment-printing", "background-removal", "alpha", "transparency",
  "image-processing", "t-shirt", "artwork-preparation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Printing",
]

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/daveatpressac-lab/printprep"
Repository = "https://github.com/daveatpressac-lab/printprep"
Issues = "https://github.com/daveatpressac-lab/printprep/issues"
Changelog = "https://github.com/daveatpressac-lab/printprep/blob/main/CHANGELOG.md"

[project.scripts]
printprep = "printprep.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
