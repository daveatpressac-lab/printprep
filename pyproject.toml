[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "printprep"
version = "0.1.0"
description = "Prepare finished artwork for garment printing: key backgrounds without halos, fit to the print canvas without distortion, and measure the result."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daveatpressac-lab" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "opencv-python-headless>=4.6",
  "Pillow>=9.1",
]
keywords = ["print-on-demand", "dtg", "background-removal", "alpha", "image-processing", "t-shirt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Printing",
]

[project.urls]
Repository = "https://github.com/daveatpressac-lab/printprep"

[project.scripts]
printprep = "printprep.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
